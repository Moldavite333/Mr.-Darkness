name: Mr Darkness Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'v3/**'
      - 'native/**'
      - '.github/workflows/mr-darkness-android.yml'

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mr-darkness-v3-debug-signing-v2

      - name: Create debug signing key if missing
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          test -f "$HOME/.android/debug.keystore"

      - name: Validate V3 JavaScript
        run: |
          node --check v3/app.js
          node --check v3/native-bridge.js

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Android SDK 36
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install native dependencies
        working-directory: native
        run: npm install

      - name: Prepare Capacitor Android project
        working-directory: native
        run: npm run prepare-android

      - name: Build debug APK
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Mr Darkness APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mr-darkness-v3-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to public download path
        run: |
          mkdir -p downloads
          cp native/android/app/build/outputs/apk/debug/app-debug.apk downloads/Mr-Darkness-V3-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/Mr-Darkness-V3-debug.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish latest Mr Darkness V3 Android APK"
            git push
          fi
